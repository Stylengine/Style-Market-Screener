name: Daily Portfolio Risk Scan

on:
  schedule:
    - cron: '15 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-risk-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository Code
        uses: actions/checkout@v4

      - name: Install Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Required Packages
        run: |
          python -m pip install --upgrade pip
          pip install yfinance openai googlesearch-python requests pandas numpy

      - name: Execute Multi-Agent Risk Engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python portfolio_tracker.py

      - name: Commit and Push Historical Metrics Updates
        run: |
          git config --global user.name "GitHub Portfolio Bot"
          git config --global user.email "actions@github.com"
          git add docs/history.csv
          git diff-index --quiet HEAD || git commit -m "Auto-update matrix tracking data sheets [skip ci]"
          git push
